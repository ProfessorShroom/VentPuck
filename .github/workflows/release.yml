name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Work out the version from the tag
        id: ver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "Tag '$TAG' must look like 1.0.0.0 or 1.0.0.0b1"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Stamp the version into the firmware
        run: sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${{ steps.ver.outputs.version }}\"/" src/version.h

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e amoled175

      - name: Attach firmware.bin to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" .pio/build/amoled175/firmware.bin --clobber
