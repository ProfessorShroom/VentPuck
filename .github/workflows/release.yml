name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, for example v1.0.0.0b1
        required: true

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Work out the version from the tag
        id: ver
        env:
          TAG_INPUT: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${TAG_INPUT:-$REF_NAME}"
          VER="${TAG#v}"
          if ! echo "$VER" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(b[0-9]+)?$'; then
            echo "Tag '$TAG' must look like 1.0.0.0 or 1.0.0.0b1"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.ver.outputs.tag }}

      - name: Stamp the version into the firmware
        run: sed -i "s/#define FW_VERSION \".*\"/#define FW_VERSION \"${{ steps.ver.outputs.version }}\"/" src/version.h

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/cache@v5
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build
        run: pio run -e ventpuck

      - name: Create the release if needed and attach firmware.bin
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            FLAG=""
            case "${{ steps.ver.outputs.version }}" in *b*) FLAG="--prerelease" ;; esac
            gh release create "$TAG" --title "$TAG" --generate-notes $FLAG
          fi
          gh release upload "$TAG" .pio/build/ventpuck/firmware.bin --clobber
